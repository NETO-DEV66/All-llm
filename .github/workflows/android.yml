name: Android QA

on:
  push:
    branches:
      - main
      - v2
      - v3
      - feature/**
  pull_request:
    branches:
      - main
      - v2
      - v3
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/v3'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Fetch latest verified runtime bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/runtime-bundles
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "NETO-DEV66/All-llm")
          token = os.environ["GITHUB_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              releases = json.load(response)

          prefixes = {
              "core": "alllm-core-arm64-",
              "claude": "alllm-claude-arm64-",
              "python": "alllm-python-arm64-",
              "android": "alllm-android-arm64-",
              "dsh": "alllm-dsh-arm64-",
              "agy": "alllm-agy-arm64-",
          }

          # Bundles published before the rebrand carry the legacy prefix. Accept
          # them as a source and republish them under the canonical name so the
          # app's RUNTIME_RELEASE_BASE_URL lookup keeps resolving.
          legacy_prefixes = {c: v.replace("alllm-", "conzyx-") for c, v in prefixes.items()}

          def published_name(component, version):
              return f"{prefixes[component]}{version}.tar.zst"

          def version_key(value):
              return tuple(int(x) for x in re.findall(r"\d+", value)) or (0,)

          selected = {}
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  for component, prefix in prefixes.items():
                      matched_prefix = next(
                          (mp for mp in (prefix, legacy_prefixes[component]) if name.startswith(mp)),
                          None,
                      )
                      if matched_prefix is not None and name.endswith(".tar.zst"):
                          version = name[len(matched_prefix):-len(".tar.zst")]
                          if version and re.fullmatch(r"[0-9A-Za-z._+-]+", version):
                              candidate = (version_key(version), version, asset)
                              current = selected.get(component)
                              if current is None or candidate[:2] > current[:2]:
                                  selected[component] = candidate

          missing = sorted(set(prefixes) - set(selected))
          if missing:
              raise SystemExit(f"Missing published runtime bundles: {', '.join(missing)}")

          manifest = {}
          for component, (_, version, asset) in selected.items():
              name = asset["name"]
              out_name = published_name(component, version)
              out = os.path.join("dist/runtime-bundles", out_name)
              download = urllib.request.Request(
                  asset["url"],
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/octet-stream",
                  },
              )
              with urllib.request.urlopen(download, timeout=300) as response, open(out, "wb") as target:
                  target.write(response.read())
              digest = asset.get("digest", "").removeprefix("sha256:")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", digest):
                  raise SystemExit(f"Missing SHA-256 digest for {name}")
              import hashlib
              actual = hashlib.sha256(open(out, "rb").read()).hexdigest()
              if actual.lower() != digest.lower():
                  raise SystemExit(f"SHA-256 mismatch for {name}: {actual} != {digest}")
              manifest[component] = {
                  "version": version,
                  "file": out_name,
                  "sha256": digest.lower(),
                  "sizeBytes": os.path.getsize(out),
              }

          with open("dist/runtime-bundles/manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          du -h dist/runtime-bundles/*.tar.zst | sort -h

      - name: Verify online build and unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testOnlineDebugUnitTest assembleOnlineDebug 2>&1 | tee "$RUNNER_TEMP/online-build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== ONLINE BUILD FAILURE ====="
            tail -n 250 "$RUNNER_TEMP/online-build.log"
            exit "$rc"
          fi

      - name: Upload emulator launch logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-launch-logs
          if-no-files-found: warn
          path: emulator-logs/


  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/v3')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configure release signing key
        shell: bash
        env:
          ALLLM_RELEASE_KEYSTORE_BASE64: ${{ secrets.ALLLM_RELEASE_KEYSTORE_BASE64 }}
          ALLLM_RELEASE_STORE_PASSWORD: ${{ secrets.ALLLM_RELEASE_STORE_PASSWORD }}
          ALLLM_RELEASE_KEY_ALIAS: ${{ secrets.ALLLM_RELEASE_KEY_ALIAS }}
          ALLLM_RELEASE_KEY_PASSWORD: ${{ secrets.ALLLM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ALLLM_RELEASE_KEYSTORE_BASE64}" || -z "${ALLLM_RELEASE_STORE_PASSWORD}" || -z "${ALLLM_RELEASE_KEY_ALIAS}" || -z "${ALLLM_RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Release signing secrets are required. No temporary signing key will be generated."
            exit 1
          fi
          printf '%s' "${ALLLM_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/alllm-release.jks"
          chmod 600 "$RUNNER_TEMP/alllm-release.jks"
          echo "ALLLM_UPLOAD_STORE_FILE=$RUNNER_TEMP/alllm-release.jks" >> "$GITHUB_ENV"
          echo "ALLLM_UPLOAD_STORE_PASSWORD=${ALLLM_RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ALLLM_UPLOAD_KEY_ALIAS=${ALLLM_RELEASE_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ALLLM_UPLOAD_KEY_PASSWORD=${ALLLM_RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Verify release signing certificate
        shell: bash
        env:
          ALLLM_RELEASE_STORE_PASSWORD: ${{ secrets.ALLLM_RELEASE_STORE_PASSWORD }}
          ALLLM_RELEASE_KEY_ALIAS: ${{ secrets.ALLLM_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="DB:80:D7:AB:56:F6:88:D0:E8:7B:13:A1:24:35:B9:E4:CB:DB:2F:45:12:D3:12:F8:37:65:32:96:D8:33:23:A3"
          ACTUAL_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/alllm-release.jks" -storepass "$ALLLM_RELEASE_STORE_PASSWORD" -alias "$ALLLM_RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          echo "Release signing SHA-256: $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The configured release keystore does not match the expected All-LLM signing certificate."
            exit 1
          fi

      - name: Fetch latest verified runtime bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/runtime-bundles
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "NETO-DEV66/All-llm")
          token = os.environ["GITHUB_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              releases = json.load(response)

          prefixes = {
              "core": "alllm-core-arm64-",
              "claude": "alllm-claude-arm64-",
              "python": "alllm-python-arm64-",
              "android": "alllm-android-arm64-",
              "dsh": "alllm-dsh-arm64-",
              "agy": "alllm-agy-arm64-",
          }

          # Bundles published before the rebrand carry the legacy prefix. Accept
          # them as a source and republish them under the canonical name so the
          # app's RUNTIME_RELEASE_BASE_URL lookup keeps resolving.
          legacy_prefixes = {c: v.replace("alllm-", "conzyx-") for c, v in prefixes.items()}

          def published_name(component, version):
              return f"{prefixes[component]}{version}.tar.zst"

          def version_key(value):
              return tuple(int(x) for x in re.findall(r"\d+", value)) or (0,)

          selected = {}
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  for component, prefix in prefixes.items():
                      matched_prefix = next(
                          (mp for mp in (prefix, legacy_prefixes[component]) if name.startswith(mp)),
                          None,
                      )
                      if matched_prefix is not None and name.endswith(".tar.zst"):
                          version = name[len(matched_prefix):-len(".tar.zst")]
                          if version and re.fullmatch(r"[0-9A-Za-z._+-]+", version):
                              candidate = (version_key(version), version, asset)
                              current = selected.get(component)
                              if current is None or candidate[:2] > current[:2]:
                                  selected[component] = candidate

          missing = sorted(set(prefixes) - set(selected))
          if missing:
              raise SystemExit(f"Missing published runtime bundles: {', '.join(missing)}")

          manifest = {}
          for component, (_, version, asset) in selected.items():
              name = asset["name"]
              out_name = published_name(component, version)
              out = os.path.join("dist/runtime-bundles", out_name)
              download = urllib.request.Request(
                  asset["url"],
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/octet-stream",
                  },
              )
              with urllib.request.urlopen(download, timeout=300) as response, open(out, "wb") as target:
                  target.write(response.read())
              digest = asset.get("digest", "").removeprefix("sha256:")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", digest):
                  raise SystemExit(f"Missing SHA-256 digest for {name}")
              import hashlib
              actual = hashlib.sha256(open(out, "rb").read()).hexdigest()
              if actual.lower() != digest.lower():
                  raise SystemExit(f"SHA-256 mismatch for {name}: {actual} != {digest}")
              manifest[component] = {
                  "version": version,
                  "file": out_name,
                  "sha256": digest.lower(),
                  "sizeBytes": os.path.getsize(out),
              }

          with open("dist/runtime-bundles/manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          du -h dist/runtime-bundles/*.tar.zst | sort -h

      - name: Compile online release APK
        run: ./gradlew --no-daemon --stacktrace assembleOnlineRelease

      - name: Compile online release AAB (Play Store)
        run: ./gradlew --no-daemon --stacktrace bundleOnlineRelease -PplayBuild=true

      - name: Verify release APK signatures and alignment
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs found"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify in-place update compatibility against previous release
        # A rebrand resets the app identity and signing key, so the historical
        # upstream baseline can never match. Verify the new package identity and
        # version instead, and warn only, so a fork without a prior release can
        # still publish.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK="app/build/outputs/apk/online/release/app-online-release.apk"
          VERSION_NAME=$(sed -n 's/.*val appVersionName = .*?: "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(awk -F'= ' '/versionCode = / {print $2; exit}' app/build.gradle.kts)
          current_badging="$($AAPT2 dump badging "$APK")"
          echo "$current_badging" | grep -q "package: name='com.netodev66.alllm'"
          echo "$current_badging" | grep -q "versionCode='$VERSION_CODE'"
          echo "$current_badging" | grep -q "versionName='$VERSION_NAME'"
          echo "PASS: valid package + versionCode $VERSION_CODE + versionName $VERSION_NAME."

      - name: Inspect release APKs
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n' | sort

