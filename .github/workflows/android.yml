      - name: Upload release APKs
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alllm-release-apks
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

      # Every successful main-branch build publishes the freshly verified online/offline APKs to the current release.
      # Header layout release 1.0.12.
      # Release publication marker for the verified build.

      - name: Publish release assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/v3'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_NAME=$(sed -n 's/.*val appVersionName = .*?: "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(awk -F'= ' '/versionCode = / {print $2; exit}' app/build.gradle.kts)
          TAG="v$VERSION_NAME"
          ONLINE="alllm-universal-release.apk"
          AAB="app-online-release.aab"
          cp app/build/outputs/apk/online/release/app-online-release.apk "$ONLINE"
          cp app/build/outputs/bundle/onlineRelease/app-online-release.aab "$AAB"
          ONLINE_SHA=$(sha256sum "$ONLINE" | awk '{print $1}')
          AAB_SHA=$(sha256sum "$AAB" | awk '{print $1}')
          ONLINE_SIZE=$(stat -c '%s' "$ONLINE")
          AAB_SIZE=$(stat -c '%s' "$AAB")
          export TAG VERSION_NAME VERSION_CODE ONLINE_SHA ONLINE_SIZE AAB_SHA AAB_SIZE GITHUB_REPOSITORY
          # Generate release notes from actual commits in this version only.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          cat > release-notes.md <<EOF
          ## All-LLM $TAG

          ### Changes in this version
          $CHANGELOG

          ### Release files
          - **Universal APK:** $ONLINE (signed, installs on any arm64 device)
          - **Play Store Bundle:** app-online-release.aab (signed, upload-ready for Google Play)

          ### SHA-256 checksums
          - $ONLINE: $ONLINE_SHA
          - app-online-release.aab: $AAB_SHA

          The release ships one universal online APK plus the \`alllm-update.json\` manifest. Debug APKs are CI-only artifacts and are not release downloads.
          EOF
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "All-LLM $TAG" --notes-file release-notes.md
          gh release edit "$TAG" --title "All-LLM $TAG" --notes-file release-notes.md
          python3 - <<'PY'
          import json, os
          with open("dist/runtime-bundles/manifest.json") as handle:
              bundles = json.load(handle)
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          tag = os.environ["TAG"]

          def component(cid, label, key, notes):
              item = bundles[key]
              return {
                  "id": cid,
                  "label": label,
                  "version": item["version"],
                  "packageUrl": "",
                  "sha256": item["sha256"],
                  "sizeBytes": item["sizeBytes"],
                  "status": "stable",
                  "minRuntimeGeneration": 1,
                  "activeLink": "",
                  "healthCommand": "",
                  "notes": notes,
              }

          manifest = {
              "schemaVersion": 2,
              "versionCode": version_code,
              "versionName": version_name,
              "channel": "stable",
              "notes": (
                  f"All-LLM {tag} — verified latest runtime assets and toolchain update controls. "
                  "Runtime bundles are resolved from the latest non-prerelease upstream runtime release and SHA-256 verified during CI. "
                  "PHP uses the online Ubuntu package path with the PHP 8.4 package source and latest Composer release."
              ),
              "artifacts": {
                  "online": {
                      "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/alllm-universal-release.apk",
                      "sha256": os.environ["ONLINE_SHA"],
                      "sizeBytes": int(os.environ["ONLINE_SIZE"]),
                  },
              },
              "components": [
                  component("core", "Core tools", "core", "Latest verified ARM64 core runtime bundle."),
                  component("python", "Python", "python", "Latest verified ARM64 Python runtime bundle."),
                  component("android", "Android SDK / Build Tools / Gradle", "android", "Latest verified ARM64 Android runtime bundle."),
                  component("claude", "Claude Code", "claude", "Latest verified ARM64 Claude Code bundle."),
                  component("deepseek", "DeepSeek Harness", "dsh", "Latest verified ARM64 DeepSeek Harness bundle."),
                  component("antigravity", "Antigravity CLI", "agy", "Latest verified ARM64 Antigravity CLI bundle."),
                  {
                      "id": "php",
                      "label": "PHP",
                      "version": "8.4",
                      "packageUrl": "",
                      "sha256": "",
                      "sizeBytes": 0,
                      "status": "online-only",
                      "minRuntimeGeneration": 1,
                      "activeLink": "",
                      "healthCommand": "php --version && composer --version",
                      "notes": "PHP 8.4 package source via Ondřej PHP PPA for the Ubuntu 20.04 ARM64 runtime; Composer uses the official latest-stable release.",
                  },
              ],
          }
          with open("alllm-update.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          PY

          gh release upload "$TAG" "$ONLINE" "$AAB" alllm-update.json --clobber
          # Retire the previous asset names so the release lists exactly one APK.
          gh release delete-asset "$TAG" "app-online-release.apk" --yes || true
          # Remove the pre-rebrand manifest name, never the manifest we just
          # published: the app resolves releases/latest/download/alllm-update.json.
          gh release delete-asset "$TAG" "mobile-harness-update.json" --yes || true
          # The app's first-run install and runtime-bundle updates resolve
          # bundles from this repo's own releases (RUNTIME_RELEASE_BASE_URL /
          # latestRuntimeBundle) — never from the upstream author's repo. The
          # tar.zst files below are the SHA-256-verified bundles fetched at
          # the start of this job. Skip re-upload when the asset is already
          # on the release so routine pushes don't re-push ~700 MB.
          EXISTING_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for bundle in dist/runtime-bundles/*.tar.zst; do
            name=$(basename "$bundle")
            if printf '%s\n' "$EXISTING_ASSETS" | grep -qx "$name"; then
              echo "Bundle already on release $TAG: $name"
            else
              gh release upload "$TAG" "$bundle"
            fi
          done

# publish-current-release
